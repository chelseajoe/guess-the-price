<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess the Price! Classroom game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E7F8F1;
  --surface: #FFFFFF;
  --surface-2: #F3FBF8;
  --ink: #2B2D42;
  --teal: #0E6B58;
  --muted: #5B6B71;
  --line: #CFE3DB;
  --coral: #E63946;
  --coral-soft: #FDECEE;
  --sun: #FFC93C;
  --tag: #FFF2B3;
  --on-color: #1F2230;
  --drop: 0 4px 0 rgba(14, 107, 88, 0.16);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F2420; --surface: #18332E; --surface-2: #1D3B35; --ink: #EAF6F1; --teal: #7FE0C4;
    --muted: #A9BFB8; --line: #2E4F48; --coral: #FF6B74; --coral-soft: #3A2226; --tag: #4A3F14;
    --drop: 0 4px 0 rgba(0, 0, 0, 0.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F2420; --surface: #18332E; --surface-2: #1D3B35; --ink: #EAF6F1; --teal: #7FE0C4;
  --muted: #A9BFB8; --line: #2E4F48; --coral: #FF6B74; --coral-soft: #3A2226; --tag: #4A3F14;
  --drop: 0 4px 0 rgba(0, 0, 0, 0.35); color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Fredoka", "Nunito", "Segoe UI Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  font-size: clamp(16px, 1.25vw, 20px); line-height: 1.4;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky, #5AB0F0); outline-offset: 3px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: clamp(14px, 2.5vw, 32px); }

/* brand */
.brand { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: clamp(30px, 4vw, 52px); font-weight: 700; color: var(--teal); letter-spacing: -0.01em; }
.brand .sticker { font-size: clamp(36px, 4.5vw, 58px); transform: rotate(-8deg); display: inline-block; }
.brand .sub { color: var(--muted); font-size: 0.95em; width: 100%; margin-top: -6px; }

/* generic panels */
.panel { background: var(--surface); border-radius: 22px; padding: clamp(14px, 2vw, 24px); box-shadow: var(--drop); }
.panel h2 { margin: 0 0 12px; font-size: 1.25em; color: var(--teal); font-weight: 600; }
.hint { color: var(--muted); font-size: 0.9em; margin: 0 0 12px; }

.btn {
  border: 0; border-radius: 999px; padding: 0.6em 1.3em; font-weight: 600;
  background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line);
  transition: transform 0.08s ease;
}
.btn:active { transform: translateY(2px); }
.btn.primary { background: var(--coral); color: #fff; box-shadow: 0 4px 0 #A8242F; }
.btn.go { background: #3DC4A0; color: var(--on-color); box-shadow: 0 4px 0 #23876C; }
.btn.big { font-size: 1.35em; padding: 0.65em 1.6em; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.small { padding: 0.3em 0.8em; font-size: 0.9em; }

/* setup */
.setup-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.teams-panel { width: 100%; max-width: 760px; margin: 0 auto; }
.mystery { display: flex; align-items: center; gap: 12px; background: var(--tag); border-radius: 14px; padding: 10px 16px; margin-top: 14px; font-weight: 600; }
.mystery span { font-size: 1.6em; }
.teacher-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.teacher-head h2 { margin: 0; }
.start-bar.split { justify-content: space-between; max-width: 760px; margin-left: auto; margin-right: auto; }
.setup-grid.open + .start-bar.split { max-width: none; }
.items-table [data-k="name"], .items-table [data-k="desc"] { min-width: 9.5em; }
@media (max-width: 860px) { .setup-grid { grid-template-columns: 1fr; } }
.stepper { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.stepper button { width: 46px; height: 46px; border-radius: 50%; border: 0; font-weight: 600; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--line); }
.stepper button[aria-pressed="true"] { background: var(--teal); color: var(--surface); box-shadow: none; }
.team-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.token {
  flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  font-size: 24px; border: 3px solid var(--surface); box-shadow: 0 0 0 3px var(--c, #ccc);
  background: var(--c, #ccc);
}
button.token { padding: 0; }
.field {
  width: 100%; min-width: 0; border: 2px solid var(--line); border-radius: 12px; padding: 0.45em 0.7em;
  background: var(--surface-2);
}
.field:focus { border-color: var(--teal); outline: none; }
.row-2 { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
.row-2 label { display: flex; flex-direction: column; gap: 4px; font-weight: 500; flex: 1 1 160px; }
.items-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
.items-table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 0.85em; padding: 0 6px; }
.items-table td { padding: 0 4px; }
.items-table .emoji-in { width: 3.2em; text-align: center; font-size: 1.2em; }
.items-table .price-in { width: 7em; }
.table-scroll { overflow-x: auto; }
.start-bar { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

/* scoreboard strip */
.scorestrip { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.roundpill { background: var(--teal); color: var(--surface); border-radius: 999px; padding: 0.35em 1em; font-weight: 600; }
.chip {
  display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px;
  padding: 4px 6px 4px 4px; box-shadow: var(--drop);
}
.chip .token { width: 34px; height: 34px; font-size: 18px; border-width: 2px; box-shadow: 0 0 0 2px var(--c); }
.chip .score { font-weight: 700; font-size: 1.2em; min-width: 1.4em; text-align: center; }
.chip .adj { border: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); font-weight: 700; line-height: 1; }

/* round stage */
.stage { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 20px; }
@media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }
.item-card { text-align: center; position: relative; overflow: hidden; }
.item-card .halo {
  width: min(62%, 260px); aspect-ratio: 1; margin: 6px auto 12px; border-radius: 50%;
  background: var(--surface-2); display: grid; place-items: center; box-shadow: inset 0 0 0 4px var(--line);
}
.item-card .halo span { font-size: clamp(80px, 10vw, 150px); line-height: 1; transform: rotate(-6deg); }
.item-card .photo {
  width: min(90%, 400px); aspect-ratio: 4 / 3; margin: 8px auto 16px; border-radius: 18px; overflow: hidden;
  border: 7px solid var(--surface); box-shadow: var(--drop), 0 0 0 2px var(--line); transform: rotate(-2deg); background: var(--surface-2);
}
.item-card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic-cell { display: flex; align-items: center; gap: 6px; }
.thumb { width: 3.4em; height: 2.55em; border-radius: 8px; object-fit: cover; display: block; box-shadow: 0 0 0 2px var(--line); flex: none; }
.thumb.inline { display: inline-block; vertical-align: middle; margin-right: 6px; width: 2.6em; height: 1.95em; }
.photo-btn { position: relative; overflow: hidden; white-space: nowrap; display: inline-flex; align-items: center; }
.photo-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo-btn:focus-within { outline: 3px solid #5AB0F0; outline-offset: 2px; }
.warn { color: var(--coral); font-weight: 600; }
.item-card h2 { font-size: clamp(28px, 3vw, 42px); margin: 0; color: var(--teal); }
.item-card .desc { color: var(--muted); margin: 4px 0 12px; font-size: 1.05em; }
.ratechip { display: inline-block; background: var(--tag); border-radius: 999px; padding: 0.25em 1em; font-weight: 600; }
.guess-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 8.5em; align-items: center; gap: 12px; padding: 6px 0; }
.guess-row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.money { position: relative; }
.money::before { content: "$"; position: absolute; left: 0.7em; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; }
.money input { padding-left: 1.6em; font-size: 1.15em; font-weight: 600; }
.result-tag { font-size: 0.9em; color: var(--muted); grid-column: 2 / 4; margin-top: -4px; }
.pts { display: inline-block; font-weight: 700; border-radius: 999px; padding: 0 0.6em; margin-left: 6px; color: var(--on-color); }
.pts.p2 { background: var(--sun); }
.pts.p1 { background: #A8E6D3; }
.pts.p0 { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }

/* the reveal: price line */
.reveal { margin-top: 20px; }
.reveal-cta { text-align: center; padding: 22px 0 8px; }
.price-tag {
  display: inline-flex; align-items: baseline; gap: 12px; background: var(--coral-soft); color: var(--coral);
  border: 3px dashed var(--coral); border-radius: 18px; padding: 0.15em 0.8em; font-weight: 700;
  font-size: clamp(40px, 6vw, 84px); transform-origin: center top;
}
.price-tag small { font-size: 0.3em; color: var(--muted); font-weight: 500; }
.drop-in { animation: drop 0.55s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes drop { from { transform: translateY(-40px) rotate(-6deg) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.track-wrap { overflow-x: auto; margin-top: 10px; }
.track { position: relative; min-width: 640px; height: var(--h, 230px); margin: 0 18px; }
.track .axis { position: absolute; left: 0; right: 0; bottom: 64px; height: 8px; border-radius: 4px; background: var(--line); }
.track .tick { position: absolute; bottom: 36px; transform: translateX(-50%); color: var(--muted); font-size: 0.8em; }
.track .truth { position: absolute; bottom: 0; transform: translateX(-50%); text-align: center; }
.track .truth .bar { width: 4px; height: 76px; background: var(--coral); margin: 0 auto; border-radius: 2px; position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); }
.track .truth .lbl { background: var(--coral); color: #fff; font-weight: 700; border-radius: 10px; padding: 2px 10px; white-space: nowrap; }
.pin { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; transition: left 0.9s cubic-bezier(.2, .9, .3, 1); }
.pin .token { width: 52px; height: 52px; font-size: 26px; }
.pin .stem { width: 3px; background: var(--c); opacity: 0.7; }
.pin .amt { font-size: 0.8em; font-weight: 600; background: var(--surface); border-radius: 8px; padding: 0 6px; margin-bottom: 4px; white-space: nowrap; box-shadow: var(--drop); }
.pin .crown { position: absolute; top: -26px; font-size: 26px; animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.winner-line { text-align: center; font-size: 1.3em; font-weight: 600; margin: 8px 0 0; }

.after { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
@media (max-width: 860px) { .after { grid-template-columns: 1fr; } }
.baht-calc { font-size: clamp(24px, 2.6vw, 36px); font-weight: 600; text-align: center; padding: 10px 0; }
.baht-calc b { color: var(--teal); font-size: 1.15em; }
.compare-cta { text-align: center; margin-top: 8px; }
.compare { margin-top: 12px; }
.cmp-row { display: grid; grid-template-columns: 6.2em minmax(0, 1fr) 7.5em; gap: 10px; align-items: center; margin: 8px 0; }
.cmp-lbl { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.dot.us, .cmp-fill.us { background: #5AB0F0; }
.dot.th, .cmp-fill.th { background: #3DC4A0; }
.cmp-box { height: 28px; background: var(--surface-2); border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--line); }
.cmp-fill { height: 100%; width: 0; border-radius: 999px; transition: width 1s cubic-bezier(.2, .9, .3, 1); }
.cmp-val { font-weight: 700; text-align: right; white-space: nowrap; }
.verdict { font-size: 1.25em; font-weight: 700; color: var(--coral); text-align: center; margin: 10px 0 0; }
.th-note { font-size: 1.25em; font-weight: 600; text-align: center; margin: 12px 0 0; }
.items-table .th-in { width: 6.5em; }
.items-table [data-k="thNote"] { min-width: 11em; }
.team-buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.team-buttons button { display: flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 4px 14px 4px 4px; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--line); font-weight: 600; }
.team-buttons button .token { width: 32px; height: 32px; font-size: 17px; border-width: 2px; }
.team-buttons button[aria-pressed="true"] { background: var(--sun); color: var(--on-color); box-shadow: none; }
.talk { background: var(--tag); border-radius: 6px; padding: 16px 20px; transform: rotate(-1deg); box-shadow: var(--drop); }
.talk p { margin: 4px 0; font-size: 1.1em; }
.talk .lead { font-weight: 700; color: var(--teal); margin: 0 0 6px; }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }

/* final */
.final-head { text-align: center; margin: 6px 0 20px; }
.final-head h2 { font-size: clamp(32px, 4.5vw, 60px); margin: 0; color: var(--teal); }
.board { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 3.2em minmax(7em, 12em) minmax(0, 1fr) 3.5em; align-items: center; gap: 12px; }
.bar-row .place { font-size: 1.8em; text-align: center; }
.bar-row .name { font-weight: 600; font-size: 1.15em; display: flex; align-items: center; gap: 10px; min-width: 0; }
.bar-row .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .barbox { background: var(--surface-2); border-radius: 999px; height: 38px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--line); }
.bar-row .fill { height: 100%; width: 0; background: var(--c); border-radius: 999px; transition: width 1.4s cubic-bezier(.2, .9, .3, 1); }
.bar-row .total { font-weight: 700; font-size: 1.5em; text-align: right; }
.bar-row.win .name span { color: var(--teal); }
.banner { text-align: center; font-size: clamp(26px, 3.4vw, 44px); font-weight: 700; margin: 22px 0 6px; }
.summary { margin-top: 24px; }
.summary table { width: 100%; border-collapse: collapse; min-width: 560px; }
.summary th, .summary td { padding: 8px 10px; text-align: left; border-bottom: 2px solid var(--line); }
.summary th { color: var(--muted); font-weight: 500; font-size: 0.9em; }
.summary td.best { font-weight: 700; }
.summary .mini { display: inline-flex; align-items: center; gap: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

  const DEFAULT_ITEMS = [

  const usd = (v) => '$' + (Math.abs(v) < 100 ? v.toFixed(2) : v.toLocaleString('en-US', { maximumFractionDigits: 2 }));
  const baht = (v) => Math.round(v * S.rate).toLocaleString('en-US');

  function roundData(r) {
    if (!S.rounds[r]) S.rounds[r] = { guesses: Array(8).fill(''), revealed: false, bahtShown: false };
    return S.rounds[r];
  }
  function scoreRound(r) {
    const rd = S.rounds[r]; const item = S.items[r];
    const out = Array(8).fill(0); const diffs = Array(8).fill(null);
    if (!rd || !rd.revealed || !item) return { pts: out, diffs, best: [] };
    const n = S.teamCount;
    for (let t = 0; t < n; t++) {
      const g = parseFloat(rd.guesses[t]);
      if (!isNaN(g)) diffs[t] = Math.abs(g - item.price);
    }
    const valid = diffs.slice(0, n).filter((d) => d !== null);
    const min = valid.length ? Math.min(...valid) : null;
    const best = [];
    for (let t = 0; t < n; t++) {
      if (diffs[t] === null) continue;
      if (Math.abs(diffs[t] - min) < 1e-9) { out[t] = 1; best.push(t); }
    }
    return { pts: out, diffs, best };
  }
  function totals() {
    const tot = Array(8).fill(0);
    S.items.forEach((_, r) => { const { pts } = scoreRound(r); pts.forEach((p, t) => { tot[t] += p; }); });
    return tot.map((v, t) => v + (S.adjust[t] || 0));
  }

  function priceLine(item, rd, sc) {
    const n = S.teamCount;
    const gs = [];
    for (let t = 0; t < n; t++) { const g = parseFloat(rd.guesses[t]); if (!isNaN(g)) gs.push({ t, g }); }
    const maxV = Math.max(item.price, ...gs.map((x) => x.g)) * 1.12 || 1;
    const pos = (v) => Math.max(0, Math.min(100, (v / maxV) * 100));
    // lanes so tokens don't overlap
    const sorted = [...gs].sort((a, b) => a.g - b.g);
    const lanes = []; const laneOf = {};
    sorted.forEach((x) => {
      const p = pos(x.g); let l = 0;
      while (lanes[l] !== undefined && p - lanes[l] < 9) l++;
      lanes[l] = p; laneOf[x.t] = l;
    });
    const laneCount = Math.max(1, lanes.length);
    const h = 150 + laneCount * 74;
    const tickLbl = (v) => (maxV >= 20 ? '$' + Math.round(v).toLocaleString('en-US') : '$' + v.toFixed(2));
    const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => `<span class="tick" style="left:${f * 100}%">${tickLbl(maxV * f)}</span>`).join('');
    const pins = gs.map(({ t, g }) => {
      const team = S.teams[t]; const stem = 18 + laneOf[t] * 74;
      const isBest = sc.best.includes(t);
      return `<div class="pin" data-left="${pos(g)}" style="left:${rd.justRevealed ? pos(item.price) : pos(g)}%; bottom:${72};">

          <span class="amt">${usd(g)}</span>${tok(team)}
        </div>
        <div class="stem" style="--c:${look(team).color};height:${stem}px"></div>
      </div>`;
    }).join('');
    const bestNames = sc.best.map((t) => esc(S.teams[t].name)).join(' and ');
    return `<div class="track-wrap"><div class="track" style="--h:${h}px">
        <div class="axis"></div>${ticks}
        <div class="truth" style="left:${pos(item.price)}%"><div class="bar"></div><span class="lbl">${usd(item.price)}</span></div>
        ${pins.replace(/bottom:72;/g, 'bottom:72px;')}
      </div></div>
      <p class="winner-line">${sc.best.length ? `👑 Closest: ${bestNames}! +1 point` : 'No guesses this round.'}</p>`;
  }

  function compareBlock(item, rd) {
    const hasTh = typeof item.thPrice === 'number' && item.thPrice > 0;
    if (!hasTh && !item.thNote) return '';
    if (!rd.thaiShown) return `<div class="compare-cta"><button class="btn" data-act="thai">Compare with Thailand</button></div>`;
    if (!hasTh) return `<div class="compare"><p class="th-note">${esc(item.thNote)}</p></div>`;
    const us = Math.round(item.price * S.rate); const th = item.thPrice; const max = Math.max(us, th);
    const r = us / th;
    const times = (x) => (x >= 3 ? Math.round(x) : x.toFixed(1));
    const verdict = r >= 1.15 ? `About ${times(r)}× more expensive in the USA!`
      : r <= 0.87 ? `Cheaper in the USA! Thailand costs about ${times(th / us)}× more.`
      : 'About the same price!';
    const bar = (cls, label, v) => `<div class="cmp-row"><span class="cmp-lbl"><span class="dot ${cls}"></span>${label}</span>
      <div class="cmp-box"><div class="cmp-fill ${cls}" data-w="${Math.max(2, (v / max) * 100)}"></div></div>
      <span class="cmp-val">${v.toLocaleString('en-US')} baht</span></div>`;
    return `<div class="compare">
      ${bar('us', 'USA', us)}${bar('th', 'Thailand', th)}
      ${item.thNote ? `<p class="hint" style="margin:6px 0 0">Thailand: ${esc(item.thNote)}</p>` : ''}
      <p class="verdict">${verdict}</p></div>`;
  }

  function viewRound() {
    const item = S.items[S.round]; const rd = roundData(S.round); const sc = scoreRound(S.round);
    const tms = teams();
    const anyGuess = tms.some((_, t) => rd.guesses[t] !== '' && !isNaN(parseFloat(rd.guesses[t])));
    const rows = tms.map((t, i) => {
      let res = '';
      if (rd.revealed) {
        if (sc.diffs[i] === null) res = `<div class="result-tag">No guess <span class="pts p0">0</span></div>`;
        else {
          const p = sc.pts[i];
          res = `<div class="result-tag">Off by ${usd(sc.diffs[i])} <span class="pts ${p ? 'p2' : 'p0'}">+${p}</span></div>`;
        }
      }
      return `<div class="guess-row">${tok(t)}<span class="name">${esc(t.name)}</span>
        <div class="money"><input class="field" inputmode="decimal" data-guess="${i}" value="${esc(rd.guesses[i])}" ${rd.revealed ? 'disabled' : ''} aria-label="${esc(t.name)} guess in dollars"></div>${res}</div>`;
    }).join('');
    const last = S.round === S.items.length - 1;
    app.innerHTML = `${brand()}${scoreStrip()}
    <div class="stage">
      <section class="panel item-card">
        ${item.img
          ? `<div class="photo"><img src="${item.img}" alt="${esc(item.name)}"></div>`
          : `<div class="halo"><span aria-hidden="true">${esc(item.emoji)}</span></div>`}
        <h2>${esc(item.name)}</h2>
        <p class="desc">${esc(item.desc)}</p>
        <span class="ratechip">$1 ≈ ${esc(S.rate)} baht</span>
      </section>
      <section class="panel">
        <h2>Team guesses (in dollars)</h2>
        <p class="hint">“We think it costs about ___ dollars.”</p>
        ${rows}
      </section>
    </div>
    <section class="panel reveal">
      ${rd.revealed
        ? `<div style="text-align:center"><span class="price-tag ${rd.justRevealed ? 'drop-in' : ''}">${usd(item.price)} <small>real US price</small></span></div>${priceLine(item, rd, sc)}`
        : `<div class="reveal-cta"><button class="btn primary big" data-act="reveal" ${anyGuess ? '' : 'disabled'}>Reveal the price</button>
           <p class="hint" style="margin-top:12px">${anyGuess ? 'Ready when you are!' : 'Type at least one team’s guess first.'}</p></div>`}
    </section>
    ${rd.revealed ? `<div class="after">
      <section class="panel">
        <h2>Calculate the baht</h2>
        ${rd.bahtShown
          ? `<div class="baht-calc">${usd(item.price)} × ${esc(S.rate)} ≈ <b>${baht(item.price)} baht</b></div>`
          : `<div class="baht-calc"><button class="btn go" data-act="baht">Show the baht</button></div>`}
        ${rd.bahtShown ? compareBlock(item, rd) : ''}
      </section>
      <section class="talk">
        <p class="lead">Talk about it</p>
        <p>Is it a decent price? 👍 👎</p>
        <p>Would you buy it?</p>
        <p>Is it cheaper in Thailand?</p>
      </section>
    </div>` : ''}
    <nav class="nav">
      <button class="btn" data-act="prev">${S.round === 0 ? 'Back to setup' : 'Previous round'}</button>
      <button class="btn ${rd.revealed ? 'primary' : ''} big" data-act="next" ${rd.revealed ? '' : 'disabled'}>${last ? 'See the winner' : 'Next round'}</button>
    </nav>`;
    if (rd.revealed) requestAnimationFrame(() => requestAnimationFrame(() => {
      app.querySelectorAll('.pin').forEach((p) => { p.style.left = p.dataset.left + '%'; });
      app.querySelectorAll('.cmp-fill').forEach((f) => { f.style.width = f.dataset.w + '%'; });
    }));
    if (rd.justRevealed) { rd.justRevealed = false; save(); }
  }

  function viewFinal() {
    const tot = totals(); const tms = teams();
    const order = tms.map((t, i) => i).sort((a, b) => tot[b] - tot[a]);
    const top = tot[order[0]]; const winners = order.filter((i) => tot[i] === top);
    const max = Math.max(1, top);
    const medal = (rank) => ['🥇', '🥈', '🥉'][rank] || '⭐';
    let rank = 0;
    const rows = order.map((i, k) => {
      if (k > 0 && tot[i] < tot[order[k - 1]]) rank = k;
      const t = S.teams[i];
      return `<div class="bar-row ${winners.includes(i) ? 'win' : ''}">
        <span class="place" aria-label="Place ${rank + 1}">${S.finalShown ? medal(rank) : '❔'}</span>
        <span class="name">${tok(t)}<span>${esc(t.name)}</span></span>
        <div class="barbox"><div class="fill" style="--c:${look(t).color}" data-w="${(tot[i] / max) * 100}"></div></div>
        <span class="total">${S.finalShown ? tot[i] : '?'}</span>
      </div>`;
    }).join('');
    const sumRows = S.items.map((it, r) => {
      const rd = S.rounds[r]; const sc = scoreRound(r);
      const cells = tms.map((t, i) => {
        const g = rd ? parseFloat(rd.guesses[i]) : NaN;
        return `<td class="${sc.best.includes(i) ? 'best' : ''}">${isNaN(g) ? '–' : usd(g)}${sc.best.includes(i) ? ' 👑' : ''}</td>`;
      }).join('');
      return `<tr><td>${it.img ? `<img class="thumb inline" src="${it.img}" alt="">` : esc(it.emoji)} ${esc(it.name)}</td><td><b>${usd(it.price)}</b></td>${cells}</tr>`;
    }).join('');
    const winNames = winners.map((i) => esc(S.teams[i].name)).join(' and ');
    app.innerHTML = `${brand()}
    <div class="final-head"><h2>Final scores</h2></div>
    <section class="panel">
      <div class="board">${rows}</div>
      ${S.finalShown
        ? `<p class="banner">🎉 ${winNames} ${winners.length > 1 ? 'win' : 'wins'}! 🎉</p>`
        : `<div class="reveal-cta"><button class="btn primary big" data-act="show-final">Show the winner</button></div>`}
    </section>
    <section class="panel summary">
      <h2>Round by round</h2>
      <p class="hint">👑 closest guess (1 point)</p>
      <div class="table-scroll"><table>
        <thead><tr><th>Item</th><th>Real price</th>${tms.map((t) => `<th>${look(t).emoji} ${esc(t.name)}</th>`).join('')}</tr></thead>
        <tbody>${sumRows}</tbody>
      </table></div>
    </section>
    <nav class="nav">
      <button class="btn" data-act="back-last">Back to the last round</button>
      <button class="btn go" data-act="play-again">Play again (same teams)</button>
    </nav>`;
    if (S.finalShown) requestAnimationFrame(() => requestAnimationFrame(() => {
      app.querySelectorAll('.fill').forEach((f) => { f.style.width = f.dataset.w + '%'; });
    }));
  }

  function render() {
    if (S.phase === 'setup') viewSetup();
    else if (S.phase === 'round') viewRound();
    else viewFinal();
    save();
  }

  /* ---------- confetti ---------- */
  function confetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.getElementById('confetti'); const ctx = c.getContext('2d');
    c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    const cols = TEAM_LOOKS.map((l) => l.color).concat(['#E63946', '#FFC93C']);
    const parts = Array.from({ length: 180 }, () => ({
      x: Math.random() * c.width, y: -Math.random() * c.height * 0.5, r: (4 + Math.random() * 6) * devicePixelRatio,
      vy: (2 + Math.random() * 3) * devicePixelRatio, vx: (Math.random() - 0.5) * 2 * devicePixelRatio,
      a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.2, col: cols[Math.floor(Math.random() * cols.length)],
    }));
    let frames = 0;
    (function tick() {
      ctx.clearRect(0, 0, c.width, c.height);
      parts.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col;
        ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
      });
      if (++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
    })();
  }

  /* ---------- photos ---------- */
  function addPhoto(i, file) {
    if (!file || !S.items[i]) return;
    if (!file.type.startsWith('image/')) { photoMsg = 'That file is not a picture. Try a JPG or PNG.'; render(); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 640; const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        const ctx = c.getContext('2d'); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        S.items[i].img = c.toDataURL('image/jpeg', 0.8);
        photoMsg = save() ? '' : 'The photo is added, but this browser is full, so it won’t be remembered after a refresh. Try smaller pictures.';
        render();
      };
      img.onerror = () => { photoMsg = 'This picture can’t be opened. Try saving it as a JPG or PNG first.'; render(); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  app.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.photo !== undefined && el.files && el.files[0]) addPhoto(+el.dataset.photo, el.files[0]);
  });
  app.addEventListener('focusin', (e) => {
    const el = e.target.closest('[data-item],[data-photo]');
    if (el) lastItem = +(el.dataset.item ?? el.dataset.photo);
  });
  document.addEventListener('paste', (e) => {
    if (S.phase !== 'setup' || !itemsOpen || lastItem === null) return;
    const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith('image/'));
    if (f) { e.preventDefault(); addPhoto(lastItem, f); }
  });

  /* ---------- events ---------- */
  app.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.team !== undefined) { S.teams[+el.dataset.team].name = el.value; save(); }
    else if (el.dataset.item !== undefined) {
      const it = S.items[+el.dataset.item]; const k = el.dataset.k;
      if (k === 'price') { const v = parseFloat(el.value); it.price = isNaN(v) ? 0 : v; }
      else if (k === 'thPrice') { const v = parseFloat(el.value); it.thPrice = isNaN(v) ? null : v; }
      else it[k] = el.value;
      save();
    } else if (el.id === 'rate') { const v = parseFloat(el.value); if (!isNaN(v) && v > 0) S.rate = v; save(); }
    else if (el.dataset.guess !== undefined) {
      roundData(S.round).guesses[+el.dataset.guess] = el.value.replace(/[^0-9.]/g, '');
      save();
      const btn = app.querySelector('[data-act="reveal"]');
      if (btn) {
        const ok = teams().some((_, t) => !isNaN(parseFloat(roundData(S.round).guesses[t])));
        btn.disabled = !ok;
        btn.nextElementSibling.textContent = ok ? 'Ready when you are!' : 'Type at least one team’s guess first.';
      }
    }
  });
  app.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.dataset.guess !== undefined) {
      const ins = [...app.querySelectorAll('[data-guess]')]; const i = ins.indexOf(e.target);
      if (i < ins.length - 1) ins[i + 1].focus(); else app.querySelector('[data-act="reveal"]')?.focus();
    }
  });
  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'count') { S.teamCount = +b.dataset.n; }
    else if (act === 'look') {
      const t = S.teams[+b.dataset.i]; const used = teams().map((x) => x.look);
      let nx = t.look; do { nx = (nx + 1) % TEAM_LOOKS.length; } while (used.includes(nx) && nx !== t.look);
      const usedDefault = !t.name.trim() || DEFAULT_NAMES.includes(t.name.trim());
      t.look = nx;
      if (usedDefault) t.name = DEFAULT_NAMES[nx];
    }
    else if (act === 'add-item') { S.items.push({ emoji: '🛍️', name: 'New item', desc: '', price: 10 }); }
    else if (act === 'del-item') { S.items.splice(+b.dataset.i, 1); S.rounds.splice(+b.dataset.i, 1); }
    else if (act === 'del-photo') { delete S.items[+b.dataset.i].img; photoMsg = ''; }
    else if (act === 'reset-all') {
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Tap again to reset everything'; return; }
      S = fresh();
    }
    else if (act === 'toggle-items') { itemsOpen = !itemsOpen; render(); if (itemsOpen) document.getElementById('teacher-settings')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    else if (act === 'start') { itemsOpen = false; S.phase = 'round'; S.round = Math.min(S.round, S.items.length - 1); }
    else if (act === 'reveal') { const rd = roundData(S.round); rd.revealed = true; rd.justRevealed = true; }
    else if (act === 'baht') { roundData(S.round).bahtShown = true; }
    else if (act === 'thai') { roundData(S.round).thaiShown = true; }
    else if (act === 'adj') { S.adjust[+b.dataset.i] = (S.adjust[+b.dataset.i] || 0) + (+b.dataset.d); }
    else if (act === 'next') { if (S.round < S.items.length - 1) S.round++; else { S.phase = 'final'; S.finalShown = false; } }
    else if (act === 'prev') { if (S.round === 0) S.phase = 'setup'; else S.round--; }
    else if (act === 'show-final') { S.finalShown = true; render(); confetti(); return; }
    else if (act === 'back-last') { S.phase = 'round'; S.round = S.items.length - 1; }
    else if (act === 'play-again') { S.rounds = []; S.adjust = Array(8).fill(0); S.round = 0; S.finalShown = false; S.phase = 'round'; }
    render();
    if (act === 'next' || act === 'prev' || act === 'start' || act === 'play-again') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      app.querySelector('[data-guess]')?.focus({ preventScroll: true });
    }
  });

  render();
})();
</script>
</body>
</html>
